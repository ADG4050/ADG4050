<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abhishek Duttagupta — Reinforcement learning and symbolic AI for networked systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#132A3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#63B9D3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#63B9D3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .edge { stroke: #63B9D3; stroke-opacity: 0.35; stroke-width: 1.2; fill: none; stroke-dasharray: 6 10; animation: flow 3.2s linear infinite; }
      .edge.slow { animation-duration: 5.1s; stroke-opacity: 0.22; }
      .edge.rev  { animation-direction: reverse; }
      @keyframes flow { to { stroke-dashoffset: -32; } }

      .node { fill: #DCEEF4; }
      .halo { fill: url(#glow); transform-origin: center; transform-box: fill-box; animation: pulse 2.8s ease-in-out infinite; }
      .halo.d1 { animation-delay: -0.7s; } .halo.d2 { animation-delay: -1.4s; } .halo.d3 { animation-delay: -2.1s; }
      @keyframes pulse { 0%,100% { transform: scale(0.6); opacity: 0.25; } 50% { transform: scale(1.25); opacity: 0.9; } }

      .rule { font: 500 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8FD3E6; fill-opacity: 0.55; animation: drift 9s ease-in-out infinite; }
      .rule.r2 { animation-delay: -3s; } .rule.r3 { animation-delay: -6s; }
      @keyframes drift { 0%,100% { transform: translateY(0px); opacity: 0.35; } 50% { transform: translateY(-6px); opacity: 0.8; } }

      .name { font: 600 46px Georgia, "Times New Roman", serif; fill: #F2F6F9; letter-spacing: -0.5px; }
      .sub  { font: 400 18px Georgia, "Times New Roman", serif; fill: #B9CBD6; }
      .cursor { fill: #63B9D3; animation: blink 1.1s steps(2) infinite; }
      @keyframes blink { to { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#63B9D3" stroke-opacity="0.05">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
    </g>

    <!-- network graph (right side) -->
    <g transform="translate(700 0)">
      <path class="edge"      d="M90 70 L210 120"/>
      <path class="edge slow" d="M210 120 L340 60"/>
      <path class="edge rev"  d="M210 120 L300 210"/>
      <path class="edge"      d="M340 60 L430 150"/>
      <path class="edge slow rev" d="M300 210 L430 150"/>
      <path class="edge"      d="M300 210 L170 260"/>
      <path class="edge rev"  d="M90 70 L40 200"/>
      <path class="edge slow" d="M40 200 L170 260"/>
      <path class="edge"      d="M430 150 L470 270"/>
      <path class="edge slow rev" d="M340 60 L460 30"/>

      <g transform="translate(90 70)"><circle class="halo d1" r="16"/><circle class="node" r="4"/></g>
      <g transform="translate(210 120)"><circle class="halo" r="22"/><circle class="node" r="5.5"/></g>
      <g transform="translate(340 60)"><circle class="halo d2" r="14"/><circle class="node" r="3.5"/></g>
      <g transform="translate(300 210)"><circle class="halo d3" r="18"/><circle class="node" r="4.5"/></g>
      <g transform="translate(430 150)"><circle class="halo d1" r="20"/><circle class="node" r="5"/></g>
      <g transform="translate(40 200)"><circle class="halo d2" r="12"/><circle class="node" r="3"/></g>
      <g transform="translate(170 260)"><circle class="halo d3" r="14"/><circle class="node" r="3.5"/></g>
      <g transform="translate(470 270)"><circle class="halo" r="12"/><circle class="node" r="3"/></g>
      <g transform="translate(460 30)"><circle class="halo d1" r="10"/><circle class="node" r="2.5"/></g>

      <!-- symbolic rule labels drifting among the nodes -->
      <text class="rule"    x="225" y="150">const(sel_brate, Q4)</text>
      <text class="rule r2" x="250" y="292">dec(throughput, Q2) → steer</text>
      <text class="rule r3" x="100" y="45">inc(reward, Q3)</text>
    </g>

    <!-- text block (left) -->
    <text class="name" x="64" y="140">Abhishek Duttagupta</text>
    <text class="sub"  x="66" y="176">Reinforcement learning &amp; symbolic AI for networked systems</text>

    <!-- prompt line -->
    <text x="66" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8FD3E6" fill-opacity="0.85">$ agent drl --explain (symbolic AI) --domain ML-for-Systems</text>
    <rect class="cursor" x="498" y="220" width="8" height="15"/>
  </g>
</svg>
